name: terraform

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.17.1
  TFLINT_VERSION: v0.65.0
  CHECKOV_VERSION: 3.4.3
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff

  validate:
    name: validate ${{ matrix.dir }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        dir:
          - bootstrap
          - envs/prod
          - modules/network
          - modules/alb
          - modules/compute
          - modules/patching
          - modules/monitoring
          - modules/remediation
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform init (no backend)
        run: |
          # Root configurations commit their lock file; CI must not change it.
          if [ -f .terraform.lock.hcl ]; then
            terraform init -backend=false -lockfile=readonly
          else
            terraform init -backend=false
          fi
      - run: terraform validate -no-color
      - name: terraform test (mocked provider, no credentials)
        if: hashFiles(format('{0}/tests/*.tftest.hcl', matrix.dir)) != ''
        run: terraform test -no-color

  tflint:
    name: tflint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ runner.os }}-${{ hashFiles('.tflint.hcl') }}
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - name: tflint --init
        run: tflint --init
        env:
          # Plugin download uses the GitHub API; the token avoids rate limits.
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --recursive --format compact

  checkov:
    name: checkov
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install "checkov==${CHECKOV_VERSION}"
      - run: checkov --config-file .checkov.yaml

  # ---------------------------------------------------------------------------
  # terraform plan on pull requests via GitHub OIDC (no stored AWS keys).
